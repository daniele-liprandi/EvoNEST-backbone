# docker-compose.yaml

services:   
  node:
    build: 
      context: .
      dockerfile: Dockerfile
    image: evonest_backbone:latest 
    container_name: evonest_backbone_prod
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.local
    environment:
      NODE_ENV: production
      MASTRA_URL: http://mastra:4111
    volumes:
      - file_storage:/usr/evonest/file_storage
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    container_name: evonest_mongodb
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.local
    volumes:
      - mongo_data:/data/db

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: mongo_backup
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env.production
      - .env.local
    volumes:
      - mongo_backups:/backups
    environment:
      DAILY_RETENTION: "7"
      WEEKLY_RETENTION: "4"
      MONTHLY_RETENTION: "12"

  mastra:
    build:
      context: ./mastra
      dockerfile: Dockerfile
    container_name: evonest_mastra_prod
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.local
    environment:
      NEXTJS_BASE_URL: http://node:3000
      PORT: "4111"
    # No published port: the service is only reachable on the compose network,
    # via the node service. See issue #54.
    depends_on:
      - mongo
      - node


volumes:
  mongo_data:
  file_storage:
  mongo_backups: